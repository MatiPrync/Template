<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>

    </header>

    <header class="filtros">
      <input type="search" id="">
    </header>
    
    <main class="comida-container" id="comidaContainer"></main> 

    <section class="addFood">

      <form id="agregarComidaForm">
        <h2>Agregar Comida</h2>

        <label for="nombre">Nombre de la comida</label>
        <input type="text" id="nombre" name="nombre" placeholder="Nombre de la comida" required>

        <label for="provincia">Provincia</label>
        <input type="text" id="provincia" name="provincia" required>

        <label for="categoria">Categoría</label>
        <input type="text" id="categoria" name="categoria" required>

        <button type="submit">Agregar</button>
      </form>
    </section>

    <script type="module" src="./main.js"></script>


    <header class="filtros">
      <input type="search" id="buscador" placeholder="Buscar por nombre, provincia, categoria, ingredientes">


      <select id="filtroCategoria">
        <option value="">Todas las Categorías</option>
        <option value="Parrilla">Parrilla</option>
        <option value="Horno">Horno</option>
        <option value="Guiso">Guiso</option>
        <option value="Frito">Frito</option>
      </select>

      <select id="filtroProvincia">
        <option value="">Todas las Categorías</option>
        <option value="Buenos Aires">Buenos Aires</option>
        <option value="Cordoba">Cordoba</option>
        <option value="Entre Ríos">Entre Ríos</option>
        <option value=""></option>
      </select>

    </header>


    <section class="Caja"></section>
    <section class="Caja"></section>
    <section class="Caja"></section>
    <section class="Caja"></section>
    <section class="Caja"></section>
    <section class="Caja"></section>
    <section class="Caja"></section>
    <section class="Caja"></section>
    <section class="Caja"></section>
    <section class="Caja"></section>
</body>
</html>
